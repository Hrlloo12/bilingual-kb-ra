x-app: &app
  image: kb-rag-api:local
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  environment:
    OPENSEARCH_URL: http://opensearch:9200
    QDRANT_URL: http://qdrant:6333
    VALKEY_URL: redis://valkey:6379/0
    VLLM_URL: http://vllm:8000/v1
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - model-cache:/models
    - ./results:/app/results
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  profiles: [gpu]

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      node.store.allow_mmap: "false"
      bootstrap.memory_lock: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.10.1.1
    entrypoint: ["vllm", "serve"]
    command:
      - ${GENERATOR_MODEL:-Qwen/Qwen3-4B-Instruct-2507-FP8}
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.55}"
      - --max-model-len
      - "8192"
      - --port
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - vllm-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 900s
    restart: unless-stopped
    profiles: [gpu]

  indexer:
    <<: *app
    command: ["python", "scripts/build_index.py"]
    depends_on:
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "8080:8080"
    depends_on:
      indexer:
        condition: service_completed_successfully
      vllm:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped

volumes:
  opensearch-data:
  qdrant-data:
  model-cache:
  vllm-cache:
