[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-rag"
version = "0.1.0"
description = "Self-hosted bilingual Arabic/English hybrid RAG over an enterprise knowledge bank"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
rag = ["static/*"]
