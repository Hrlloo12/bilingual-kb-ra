paths:
  facts_dir: data/facts
  templates_dir: data/templates
  corpus_raw: data/corpus/raw
  corpus_processed: data/corpus/processed

opensearch:
  url: http://localhost:9200
  index: kb_chunks
  timeout_s: 10

qdrant:
  url: http://localhost:6333
  collection: kb_chunks_ft
  timeout_s: 10

valkey:
  url: redis://localhost:6379/0

chunking:
  max_chars: 1200

embedding:
  model: halarash/qimam-qwen3-embedding-0.6b-kb-v2
  device: auto
  batch_size: 16
  max_seq_length: 512
  query_instruction: Given a question in Arabic or English, retrieve knowledge bank passages that answer the question

retrieval:
  bm25_top_k: 50
  dense_top_k: 50
  rrf_k: 60
  bm25_weight: 1.0
  dense_weight: 1.0
  candidates: 30

quick_search:
  top_k: 10
  snippet_chars: 240

reranker:
  model: halarash/qimam-bge-reranker-v2-m3-kb
  device: auto
  batch_size: 32
  max_length: 512

generation:
  url: http://localhost:8000/v1
  model: Qwen/Qwen3-4B-Instruct-2507-FP8
  temperature: 0.0
  max_tokens: 384
  timeout_s: 60

smart_search:
  context_top_k: 4
  context_min_score: 0.5
  abstain_threshold: 0.844483
  abstain_on_unsupported_numbers: true
