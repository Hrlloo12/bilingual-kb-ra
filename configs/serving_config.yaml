paths:
  facts_dir: data/facts
  templates_dir: data/templates
  corpus_raw: data/corpus/raw
  corpus_processed: data/corpus/processed

opensearch:
  url: http://localhost:9200
  index: kb_chunks
  timeout_s: 10

qdrant:
  url: http://localhost:6333
  collection: kb_chunks
  timeout_s: 10

valkey:
  url: redis://localhost:6379/0

chunking:
  max_chars: 1200

embedding:
  model: Qwen/Qwen3-Embedding-0.6B
  device: auto
  batch_size: 16
  max_seq_length: 512
  query_instruction: Given a question in Arabic or English, retrieve knowledge bank passages that answer the question

retrieval:
  bm25_top_k: 50
  dense_top_k: 50
  rrf_k: 60
  bm25_weight: 1.0
  dense_weight: 1.0
  candidates: 30

quick_search:
  top_k: 10
  snippet_chars: 240
