domain: stores
description: Regional showroom directory with addresses, phone numbers and services.
attributes:
  location:
    value: {ar: "{street_ar}، {district_ar}", en: "{street_en}, {district_en}"}
    statement:
      ar: "يقع معرض {subject_ar} على {street_ar} في {district_ar}."
      en: "The {subject_en} showroom is on {street_en} in {district_en}."
  phone:
    value: {ar: "{phone}", en: "{phone}"}
