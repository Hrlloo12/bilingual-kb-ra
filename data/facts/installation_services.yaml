domain: installation_services
description: Typical installation duration and team size for each product type.
attributes:
  duration:
    value: {ar: "نحو {minutes} دقيقة", en: "about {minutes} minutes"}
    statement:
      ar: "يستغرق تركيب {subject_ar} نحو {minutes} دقيقة."
      en: "Installing {subject_en} takes about {minutes} minutes."
    numbers: [minutes]
  technicians:
    value: {ar: "فريق من {count} فنيين", en: "a team of {count} technicians"}
    statement:
      ar: "ينفذ تركيب {subject_ar} فريق من {count} فنيين."
      en: "Installation of {subject_en} is carried out by a team of {count} technicians."
    numbers: [count]
