domain: catalog
description: Catalogue products with codes, prices and dimensions across eight product categories.
attributes:
  price:
    value: {ar: "{price} ريال سعودي", en: "{price} SAR"}
    statement:
      ar: "سعر {subject_ar} (الرمز {code}) هو {price} ريال سعودي."
      en: "The {subject_en} (code {code}) is priced at {price} SAR."
    numbers: [price]
  dimensions:
    value: {ar: "{dims} سم", en: "{dims} cm"}
    statement:
      ar: "أبعاد {subject_ar} (الرمز {code}) هي {dims} سم (العرض × العمق × الارتفاع)."
      en: "The {subject_en} (code {code}) measures {dims} cm (width × depth × height)."
    numbers: [dims]
